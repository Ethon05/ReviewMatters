<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <title>ReviewMattrs | NFC Google Review Cards &amp; Reputation Management</title>
    <meta
      name="description"
      content="Make collecting genuine Google reviews effortless with ReviewMattrs NFC review cards, QR technology, and reputation management software."
    />
    <link rel="canonical" href="https://www.reviewmattrs.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ReviewMattrs" />
    <meta property="og:url" content="https://www.reviewmattrs.com/" />
    <meta property="og:title" content="ReviewMattrs | NFC Google Review Cards &amp; Reputation Management" />
    <meta
      property="og:description"
      content="Turn every customer interaction into a lasting impression with ReviewMattrs NFC-enabled Google Review cards and reputation analytics."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReviewMattrs | NFC Google Review Cards &amp; Reputation Management" />
    <meta
      name="twitter:description"
      content="Make collecting genuine Google reviews effortless with ReviewMattrs NFC review cards and reputation management software."
    />

    <!-- Google Fonts: Manrope & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "ReviewMattrs",
            "url": "https://www.reviewmattrs.com",
            "description": "Reputation management technology platform combining NFC Google Review cards and SaaS feedback analytics."
          },
          {
            "@type": "Product",
            "name": "ReviewMattrs NFC Google Review Card",
            "description": "Physical NFC and QR-enabled review collection card configured with your business Google Review destination.",
            "brand": {
              "@type": "Brand",
              "name": "ReviewMattrs"
            },
            "offers": {
              "@type": "Offer",
              "price": "1200",
              "priceCurrency": "BDT",
              "availability": "https://schema.org/InStock"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is a ReviewMattrs NFC card?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "A ReviewMattrs NFC card is a physical contactless card with a built-in NFC chip and backup QR code that opens your business Google Review page when tapped or scanned by a smartphone."
                }
              },
              {
                "@type": "Question",
                "name": "Do customers need to install an application?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Customers tap their NFC-enabled smartphone or scan the QR code using their built-in camera, and the review page opens directly in their mobile browser."
                }
              },
              {
                "@type": "Question",
                "name": "Can ReviewMattrs prevent negative Google reviews?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. Google controls its review platform and prohibits blocking or gating negative reviews. Every customer retains equal access to your Google Review page while ReviewMattrs helps you capture private feedback and respond faster."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body class="bg-[#050505] text-white antialiased selection:bg-[#00E68A]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
